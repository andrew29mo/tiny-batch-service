name: Correctness and HTTP evidence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: python -m pip install -r requirements-dev.txt
      - name: Formal HTTP/ORT and controllable-clock tests
        run: python -m unittest discover -s tests -v
      - name: Optimized Python validation
        run: python -O -m unittest discover -s tests
      - name: Behavioral source mutations
        run: python tools/run_mutations.py
      - name: Recorded evidence and publication hygiene
        run: python tools/check_project.py
      - name: Actual HTTP/ORT timing smoke, not a performance gate
        run: |
          python tools/benchmark.py --output results/local/ci --count 40 --rates 200 --repeats 2
          python tools/check_project.py --directory results/local/ci --smoke
