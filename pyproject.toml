[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-batch-service"
version = "0.1.0"
description = "Bounded dynamic batching with reproducible HTTP arrival-trace measurements"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
requires-python = ">=3.12,<3.13"
dependencies = ["aiohttp==3.14.5", "numpy==1.26.4", "onnxruntime==1.31.0", "psutil==7.0.0"]

[project.scripts]
tiny-batch-service = "tiny_batch_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
